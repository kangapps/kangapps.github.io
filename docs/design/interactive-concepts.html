const apps=[{"slug": "pipixel", "name": "Pipixel", "desc": "Connect the pipes, solve the puzzle", "features": [{"title": "5 Worlds", "body": "Explore Garden, Ocean, Cosmos, Jungle, and Volcano — each with unique visuals and increasing difficulty."}, {"title": "250 Levels", "body": "From easy warm-ups to mind-bending challenges. 50 hand-crafted levels per world."}, {"title": "Star Ratings", "body": "Earn up to 3 stars per level based on how efficiently you solve each puzzle."}, {"title": "Hint System", "body": "Stuck? Use hints to rotate a pipe to its correct orientation and keep progressing."}, {"title": "Relaxing Music", "body": "Enjoy calming background tracks while you solve puzzles at your own pace."}, {"title": "iOS & Android", "body": "Available on both platforms. Your progress is stored locally on your device."}], "icon": "../../pipixel/assets/pipixel-icon.png", "category": "Games", "status": "Available", "store": "https://apps.apple.com/app/pipixel"}, {"slug": "numbermatch", "name": "Number Match: Pair Puzzle", "desc": "Match pairs. Clear the board.", "features": [{"title": "Match to 10", "body": "Choose two equal numbers or two numbers that add up to 10."}, {"title": "Clear the board", "body": "Connect numbers in the same row or column through empty cells. Another number blocks the path."}, {"title": "Fresh puzzles", "body": "Play regular puzzles and return for a new daily challenge."}, {"title": "Choose your pace", "body": "Pick a difficulty and solve each board without a countdown."}, {"title": "Helpful hints", "body": "Use free hints, undo a move, or choose to watch an ad for extra hints."}, {"title": "Your progress stays on your device", "body": "Keep your saved game and records locally. No account is needed."}], "icon": "../../numbermatch/assets/numbermatch-icon.png", "category": "Games", "status": "Coming soon", "store": null}, {"slug": "bloceraze", "name": "Bloceraze", "desc": "Place blocks. Clear lines. Keep the combo.", "features": [{"title": "Place colorful blocks", "body": "Drag each piece onto the board and make room for the next set."}, {"title": "Clear rows and columns", "body": "Complete a horizontal row or vertical column to clear it from the board."}, {"title": "Build satisfying combos", "body": "Clear several lines together and keep your score moving upward."}, {"title": "A varied set of shapes", "body": "Fit short bars, corners, squares, and other block shapes into the board."}, {"title": "Helpful hints and undo", "body": "Review a possible move, undo a placement, or choose an optional rewarded video for extra help."}, {"title": "Your progress stays on your device", "body": "Resume your saved game without creating an account or syncing to a cloud account."}], "icon": "../../bloceraze/assets/app-icon.png", "category": "Games", "status": "Coming soon", "store": null}, {"slug": "colorsort", "name": "ColorSort: Candy Tubes", "desc": "Sort colorful candies, one satisfying pour at a time", "features": [{"title": "200 Puzzles", "body": "Work through 200 carefully arranged levels with a gradually increasing challenge."}, {"title": "Simple Color Sorting", "body": "Move candies onto a matching color or into an empty tube until every color is sorted."}, {"title": "Undo or Restart", "body": "Try another move or restart the current puzzle whenever you need to."}, {"title": "Optional Bonus Tube", "body": "Watch an optional rewarded video to add an extra tube to a puzzle."}, {"title": "Saved on Your Device", "body": "Your level and game progress are saved locally on your device."}, {"title": "iOS &amp; Android", "body": "Play on iPhone, iPad, or Android. No account is required."}], "icon": "../../colorsort/assets/colorsort-icon.png", "category": "Games", "status": "Available", "store": null}, {"slug": "boxingtimer", "name": "Boxing Timer", "desc": "Train smarter, fight harder", "features": [{"title": "Custom Rounds", "body": "Configure rounds, duration, rest periods, and warning alerts to match your training style loading="lazy">'}function card(a){const common='<span class="cat">'+a.category+'</span><strong>'+a.name+'</strong><span class="desc">'+a.desc+'</span><span class="status">'+(a.status==='Coming soon'?'Coming soon':a.status==='External site'?'macOS · External site':a.slug==='colorsort'?'iOS · Android':'iOS')+'</span>';if(a.external)return '<a class="app-card external-card" href="'+a.external+'">'+image(a)+common+'</a>';return '<button type="button" class="app-card" data-app="'+a.slug+'">'+image(a)+common+'</button>'}function home(){category='All';view.innerHTML='<section class="hero" id="top"><div><p class="eyebrow">An independent app collection</p><h1>Games to pick up.<br>Tools to keep close.</h1><p class="hero-copy">Puzzle games and everyday tools, made for a clear purpose — and a place in your day.</p></div><div class="hero-visual" aria-label="A selection of JK Apps"><div class="hero-app">'+image(apps[0])+'<span>Pipixel</span></div><div class="hero-app">'+image(apps[4])+'<span>Boxing Timer</span></div><div class="hero-app">'+image(apps[5])+'<span>BakeWeigh</span></div><div class="hero-foot"><span>Four games</span><span>Two everyday tools</span></div></div></section><section class="catalog" aria-labelledby="catalog-title"><div class="catalog-head"><h2 id="catalog-title">Find your next app</h2></div><div class="filters" role="group" aria-label="Filter apps"><button type="button" data-filter="All" aria-pressed="true">All</button><button type="button" data-filter="Games" aria-pressed="false">Games</button><button type="button" data-filter="Everyday tools" aria-pressed="false">Everyday tools</button></div><p class="visually-hidden" role="status" id="result-count"></p><div id="groups"></div></section>';const render=()=>{let filtered=apps.filter(a=>(category==='All'||a.category===category)&&!a.external);let groups=category==='All'?['Games','Everyday tools']:[category];document.querySelector('#groups').innerHTML=groups.map(g=>{let values=filtered.filter(a=>a.category===g);if(g==='Everyday tools'&&category==='All')values=[...values,apps.find(a=>a.external)];if(!values.length)return '';return '<section class="group" id="'+(g==='Games'?'games':'tools')+'"><div class="group-title"><h3>'+g+'</h3><span>'+values.length+(g==='Everyday tools'?' including external site':' apps')+'</span></div><div class="grid">'+values.map(card).join('')+'</div></section>'}).join('');document.querySelector('#result-count').textContent=(filtered.length+((category==='All'||category==='Everyday tools')?1:0))+' entries shown';document.querySelectorAll('[data-app]').forEach(b=>b.addEventListener('click',()=>detail(apps.find(a=>a.slug===b.dataset.app))))};document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));render()}function detail(a){returnSlug=a.slug;let internal='<a href="../../'+a.slug+'/support/">Support</a><a href="../../'+a.slug+'/privacy/">Privacy</a>';let actions=a.store?'<a class="primary" href="'+a.store+'">App Store ↗</a>'+internal:'<span class="availability">'+(a.status==='Coming soon'?'Coming soon · Store links will follow':'Store link to be confirmed')+'</span>'+internal;view.innerHTML='<section class="detail"><button class="back" type="button" id="back">← All apps</button><div class="detail-panel"><div class="detail-intro">'+image(a)+'<div class="meta">'+a.category+' · '+a.status+'</div><h1 tabindex="-1">'+a.name+'</h1><p>'+a.desc+'</p><div class="actions">'+actions+'</div></div><div class="detail-features"><h2>What it does</h2>'+a.features.map(f=>'<article class="feature"><h3>'+f.title+'</h3><p>'+f.body+'</p></article>').join('')+'</div></div></section>';document.querySelector('#back').addEventListener('click',()=>{home();let target=view.querySelector('[data-app="'+returnSlug+'"]');if(target)target.focus()});document.querySelector('.detail-intro h1').focus()}home();document.querySelectorAll('[data-set]').forEach(b=>b.addEventListener('click',()=>{document.querySelector('#stage').dataset.direction=b.dataset.set;document.querySelectorAll('[data-set]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));</script></body></html>
